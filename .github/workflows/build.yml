name: ESP-IDF Build (ESP32-C3)

on:
  push:
    branches: [cn-localization, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget flex bison gperf python3-pip python3-venv cmake ninja-build ccache libffi-dev libssl-dev dfu-util libusb-1.0-0

      - name: Install ESP-IDF v4.4
        run: |
          mkdir -p ~/esp
          cd ~/esp
          git clone -b v4.4 --recursive https://github.com/espressif/esp-idf.git esp-idf-v4.4
          cd esp-idf-v4.4
          pip install setuptools
          ./install.sh

      - name: Build for ESP32-C3
        run: |
          . ~/esp/esp-idf-v4.4/export.sh
          rm -rf build
          idf.py set-target esp32c3
          idf.py build

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32c3-firmware
          path: |
            build/esp32-wifi-penetration-tool.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
